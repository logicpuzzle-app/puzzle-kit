<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>セル結合のID保持 Before / After</title><style>body{font:16px system-ui;max-width:1400px;margin:24px auto;padding:16px;color:#17212b;background:#f5f7fa}section{background:white;padding:20px;margin:20px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}img,video{width:100%;max-height:70vh;object-fit:contain}button{padding:10px;margin-right:10px}@media(max-width:650px){.pair{grid-template-columns:1fr}}</style><h1>セル結合のID保持 Before / After</h1><p>同じ2×2盤面の上2セルを結合。Beforeでは再生成により頂点注記が消えます。Afterは存続する境界頂点のIDと注記を保持します。</p><p>AfterではUndo/Redo、保存・再読込、プロパティからの結合解除も確認。PCはマウス、モバイルはタッチで入力します。別実行のため動画の操作時刻は一致しません。</p><p><a href="evidence.json">revision・結果・SHA256</a></p><button onclick="document.querySelectorAll('video').forEach(v=>{v.currentTime=0;v.play()})">先頭から再生</button><button onclick="document.querySelectorAll('video').forEach(v=>v.pause())">一時停止</button><section><h2>chromium</h2><div class="pair"><div><h3>before</h3><a href="before-chromium.png"><img src="before-chromium.png" alt="before chromium"></a><video controls preload="metadata" src="before-chromium.webm"></video></div><div><h3>after</h3><a href="after-chromium.png"><img src="after-chromium.png" alt="after chromium"></a><video controls preload="metadata" src="after-chromium.webm"></video></div></div><p><a href="after-chromium-restored.png">After: 結合解除後</a></p></section><section><h2>mobile-chrome</h2><div class="pair"><div><h3>before</h3><a href="before-mobile-chrome.png"><img src="before-mobile-chrome.png" alt="before mobile-chrome"></a><video controls preload="metadata" src="before-mobile-chrome.webm"></video></div><div><h3>after</h3><a href="after-mobile-chrome.png"><img src="after-mobile-chrome.png" alt="after mobile-chrome"></a><video controls preload="metadata" src="after-mobile-chrome.webm"></video></div></div><p><a href="after-mobile-chrome-restored.png">After: 結合解除後</a></p></section></html>
